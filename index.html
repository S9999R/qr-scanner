<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Scanner &amp; Maker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    max-width: 480px; margin-inline: auto;
    font: 16px/1.5 system-ui, sans-serif;
    background: #111; color: #eee;
  }
  h1 { font-size: 1.3rem; text-align: center; }
  button, .btn {
    display: block; width: 100%; min-height: 48px;
    margin: 8px 0; padding: 12px;
    font: inherit; font-weight: 600; text-align: center; text-decoration: none;
    border: 0; border-radius: 10px;
    background: #2d7ff9; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  input {
    width: 100%; min-height: 48px; padding: 12px;
    font: inherit; border: 1px solid #444; border-radius: 10px;
    background: #1c1c1c; color: #eee;
  }
  nav { display: flex; gap: 8px; margin-bottom: 16px; }
  nav button { background: #333; }
  nav button.on { background: #2d7ff9; }
  section[hidden], [hidden] { display: none; }
  #reader { width: 100%; border-radius: 10px; overflow: hidden; }
  #qrImg { width: 100%; max-width: 280px; margin: 16px auto 4px; display: block; background: #fff; border-radius: 10px; }
  #decoded { word-break: break-all; background: #1c1c1c; padding: 12px; border-radius: 10px; }
  #decoded a { color: #6bb0ff; }
  .err { color: #ff8080; }
  .hint { font-size: .85rem; color: #999; text-align: center; }
</style>
</head>
<body>

<h1>QR Scanner &amp; Maker</h1>

<nav>
  <button id="tabScan" class="on">Scan</button>
  <button id="tabMake">Make</button>
</nav>

<!-- Scan -->
<section id="scan">
  <div id="reader"></div>
  <button id="startBtn">Start camera</button>
  <p id="scanErr" class="err"></p>
  <div id="decoded" hidden>
    <p id="decodedText"></p>
    <a id="decodedLink" class="btn" target="_blank" rel="noopener noreferrer" hidden>Open link</a>
    <button id="copyBtn">Copy</button>
  </div>
</section>

<!-- Make -->
<section id="make" hidden>
  <input id="urlInput" type="url" inputmode="url" placeholder="https://example.com" autocomplete="off">
  <button id="makeBtn">Make QR code</button>
  <p id="makeErr" class="err"></p>
  <div id="madeQr" hidden>
    <img id="qrImg" alt="Your QR code">
    <a id="dlBtn" class="btn" download="qr.png">Download</a>
    <p class="hint">On iPhone you can also long-press the code &rarr; Save to Photos.</p>
  </div>
</section>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module">
import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm';

const $ = id => document.getElementById(id);

// --- tabs ---
function show(scanOn) {
  $('scan').hidden = !scanOn;
  $('make').hidden = scanOn;
  $('tabScan').classList.toggle('on', scanOn);
  $('tabMake').classList.toggle('on', !scanOn);
  if (!scanOn) stopScan();          // don't leave the camera running in the background
}
$('tabScan').onclick = () => show(true);
$('tabMake').onclick = () => show(false);

// --- scan ---
const qr = new Html5Qrcode('reader');
let scanning = false;

async function stopScan() {
  if (!scanning) return;
  scanning = false;
  $('startBtn').textContent = 'Start camera';
  try { await qr.stop(); } catch {}
}

$('startBtn').onclick = async () => {
  if (scanning) return stopScan();
  $('scanErr').textContent = '';
  try {
    // facingMode: rear camera, or phones open the selfie cam
    await qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, onScan, () => {});
    scanning = true;
    $('startBtn').textContent = 'Stop camera';
  } catch {
    $('scanErr').textContent =
      'Camera unavailable. Needs HTTPS and camera permission. On iPhone, open this page in Safari or Chrome directly — in-app browsers (Instagram, Facebook) block the camera.';
  }
};

async function onScan(text) {
  await stopScan();
  $('decoded').hidden = false;
  $('decodedText').textContent = text;
  const link = $('decodedLink');
  link.hidden = true;
  // Only linkify http(s) — a QR can carry javascript:/data: URIs. Never auto-navigate.
  try {
    const u = new URL(text);
    if (u.protocol === 'http:' || u.protocol === 'https:') {
      link.href = text;
      link.hidden = false;
    }
  } catch {}
}

$('copyBtn').onclick = () => navigator.clipboard.writeText($('decodedText').textContent);

// --- make ---
$('makeBtn').onclick = () => {
  const text = $('urlInput').value.trim();
  if (!text) return;
  QRCode.toDataURL(text, { width: 280, margin: 2 }, (err, url) => {
    $('makeErr').textContent = err ? "Couldn't make a QR code from that (too long?)." : '';
    $('madeQr').hidden = !!err;
    if (!err) { $('qrImg').src = url; $('dlBtn').href = url; }
  });
};
$('urlInput').onkeydown = e => { if (e.key === 'Enter') $('makeBtn').click(); };
</script>

</body>
</html>
